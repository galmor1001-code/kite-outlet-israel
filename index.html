    // ==========================================
    // 2. באנר מבצעים מתחלף (ללא שנתון כפול)
    // ==========================================
    let currentPromoIdx = 0;
    const promoItems = products.filter(p => p.importer === "ימית" || p.importer === "קייט לאב");

    function updatePromoSlider() {
      if (!promoItems.length) return;
      const item = promoItems[currentPromoIdx];
      const titleText = item.model.includes(item.year) ? `${item.brand} ${item.model}` : `${item.brand} ${item.model} ${item.year}`;
      
      const titleEl = document.getElementById('promoTitle');
      const oldPriceEl = document.getElementById('promoOldPrice');
      const newPriceEl = document.getElementById('promoNewPrice');
      const imgEl = document.getElementById('promoImg');

      if (titleEl) titleEl.innerText = titleText;
      if (oldPriceEl) oldPriceEl.innerText = item.regularPrice;
      if (newPriceEl) newPriceEl.innerText = item.outletPrice;
      if (imgEl) imgEl.src = item.img;

      currentPromoIdx = (currentPromoIdx + 1) % promoItems.length;
    }
    setInterval(updatePromoSlider, 3500);

    function openCurrentPromoItem() {
      if (!promoItems.length) return;
      const activeIdx = (currentPromoIdx - 1 + promoItems.length) % promoItems.length;
      openCheckStockModal(promoItems[activeIdx]);
    }

    // ==========================================
    // 3. סינון ותצוגת קטלוג
    // ==========================================
    function initFilters() {
      const brands = [...new Set(products.map(p => p.brand))];
      const brandSel = document.getElementById('filterBrand');
      if (!brandSel) return;
      brandSel.innerHTML = '<option value="">כל המותגים</option>';
      brands.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b; 
        opt.innerText = b;
        brandSel.appendChild(opt);
      });
    }

    function renderCatalog() {
      const searchEl = document.getElementById('searchInput');
      const brandEl = document.getElementById('filterBrand');
      const catEl = document.getElementById('filterCategory');
      const grid = document.getElementById('catalogGrid');
      if (!grid) return;

      const q = searchEl ? searchEl.value.toLowerCase() : '';
      const b = brandEl ? brandEl.value : '';
      const c = catEl ? catEl.value : '';

      const filtered = products.filter(p => {
        const matchesQ = (p.brand + " " + p.model + " " + p.importer + " " + p.year).toLowerCase().includes(q);
        const matchesB = !b || p.brand === b;
        const matchesC = !c || p.category.includes(c);
        return matchesQ && matchesB && matchesC;
      });

      grid.innerHTML = filtered.map(p => `
        <div class="card">
          <div class="card-img-wrap">
            <span class="card-badge">חיסכון ${p.discount}</span>
            ${p.special ? `<span class="card-special-badge" style="position:absolute; bottom:8px; right:10px; background:#e0f2fe; color:#0284c7; font-size:0.7rem; font-weight:700; padding:2px 6px; border-radius:4px;">${p.special}</span>` : ''}
            <img src="${p.img}" alt="${p.model}" onerror="this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&auto=format&fit=crop'">
          </div>
          <div class="card-body">
            <div class="card-brand">${p.brand} | יבואן: ${p.importer}</div>
            <div class="card-title">${p.model}</div>
            <div class="card-meta">מידות: ${p.sizes} | שנתון: ${p.year}</div>
            <div class="card-prices">
              <span class="price-regular">${p.regularPrice}</span>
              <span class="price-outlet">${p.outletPrice}</span>
            </div>
            <button class="btn-check-stock" onclick='openCheckStockModal(${JSON.stringify(p)})'>בדיקת זמינות וקוד הנחה</button>
          </div>
        </div>
      `).join('');
    }

    // ==========================================
    // 4. פתיחה וסגירת חלונות מודל (Modals)
    // ==========================================
    function openCheckStockModal(product) {
      document.getElementById('leadProduct').value = `${product.brand} ${product.model} (${product.year})`;
      document.getElementById('leadProductDisplay').value = `${product.brand} ${product.model} (${product.year})`;
      document.getElementById('leadImporter').value = product.importer;
      document.getElementById('leadPrice').value = product.outletPrice;
      document.getElementById('leadSize').value = product.sizes.split(',')[0].split('/')[0].trim() || '';
      document.getElementById('checkStockForm').style.display = 'block';
      document.getElementById('hotLeadSuccess').style.display = 'none';
      document.getElementById('checkStockModal').style.display = 'flex';
    }

    function openLeadModal() {
      const form = document.getElementById('hunterForm');
      const succ = document.getElementById('hunterSuccess');
      if (form) form.style.display = 'block';
      if (succ) succ.style.display = 'none';
      document.getElementById('hunterModal').style.display = 'flex';
    }

    function openQuizModal() {
      const qForm = document.getElementById('quizForm');
      const qRes = document.getElementById('quizResult');
      if (qForm) qForm.style.display = 'block';
      if (qRes) qRes.style.display = 'none';
      const qModal = document.getElementById('quizModal');
      if (qModal) qModal.style.display = 'flex';
    }

    function closeModal(id) { 
      const el = document.getElementById(id);
      if (el) el.style.display = 'none'; 
    }

    // ==========================================
    // 5. שליחת לידים מהירה ללא השהייה (חם + קר)
    // ==========================================
    function submitHotLead(e) {
      e.preventDefault();
      const payload = {
        sheetName: 'ליד חם',
        name: document.getElementById('leadName').value,
        phone: document.getElementById('leadPhone').value,
        email: document.getElementById('leadEmail').value || 'לא הושאר מייל',
        product: document.getElementById('leadProduct').value,
        importer: document.getElementById('leadImporter').value,
        price: document.getElementById('leadPrice').value,
        size: document.getElementById('leadSize').value
      };

      // אישור מיידי על המסך
      document.getElementById('checkStockForm').style.display = 'none';
      document.getElementById('hotLeadSuccess').style.display = 'block';

      // שליחה ברקע לגוגל שיטס
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.error("Hot lead error:", err));

      setTimeout(() => {
        closeModal('checkStockModal');
        document.getElementById('checkStockForm').reset();
      }, 2000);
    }

    function submitColdLead(e) {
      e.preventDefault();
      const payload = {
        sheetName: 'ליד קר',
        name: document.getElementById('hunterName').value,
        phone: document.getElementById('hunterPhone').value,
        details: document.getElementById('hunterDetails').value
      };

      // אישור מיידי על המסך
      document.getElementById('hunterForm').style.display = 'none';
      document.getElementById('hunterSuccess').style.display = 'block';

      // שליחה ברקע לגוגל שיטס
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.error("Cold lead error:", err));

      setTimeout(() => {
        closeModal('hunterModal');
        document.getElementById('hunterForm').reset();
      }, 2000);
    }

    // שאלון התאמת ציוד
    let currentRecommendedProduct = null;
    function submitQuiz(e) {
      e.preventDefault();
      const style = document.getElementById('quizStyle').value;
      currentRecommendedProduct = products.find(p => p.category.includes('קייט')) || products[0];
      if (style === 'Big Air') {
        currentRecommendedProduct = products.find(p => p.model.includes('Orbit') || p.model.includes('Atmos')) || currentRecommendedProduct;
      }

      document.getElementById('quizForm').style.display = 'none';
      document.getElementById('quizResult').style.display = 'block';
      document.getElementById('quizRecommendedItem').innerText = `ההמלצה המובילה עבורך: ${currentRecommendedProduct.brand} ${currentRecommendedProduct.model} (${currentRecommendedProduct.year}) במחיר אאוטלט של ${currentRecommendedProduct.outletPrice}`;
    }

    function selectQuizItemAndClose() {
      closeModal('quizModal');
      if (currentRecommendedProduct) openCheckStockModal(currentRecommendedProduct);
    }

    // ==========================================
    // 6. פורטל יבואנים: משיכת נתוני אמת חיים
    // ==========================================
    function promptImporterPortal() {
      const imp = prompt("הזן שם יבואן (למשל: ימית, מאי פוינט, קייט לאב):");
      if (imp) openPortalDashboard(imp.trim());
    }

    async function getLiveLeadsCount(importerName) {
      let hotCount = 0;
      let coldCount = 0;
      let modelStats = {};

      const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&id=${SPREADSHEET_ID}&t=` + new Date().getTime();

      try {
        const response = await fetch(CSV_URL);
        if (response.ok) {
          const csvText = await response.text();
          const rows = csvText.split(/\r?\n/).map(r => r.split(','));
          
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 2) continue;

            const rowImporter = (row[6] || '').trim(); // עמודת יבואן (G)
            const rowProduct = (row[4] || '').trim();  // עמודת מוצר ודגם (E)

            if (rowImporter.includes(importerName) || rowProduct.includes(importerName)) {
              hotCount++;
              modelStats[rowProduct] = (modelStats[rowProduct] || 0) + 1;
            }
          }
        }
      } catch (err) {
        console.log("פורטל: אין נתונים כרגע או גיליון נקי");
      }

      return { hotCount, coldCount, modelStats };
    }

    async function openPortalDashboard(importerName) {
      document.getElementById('portalSelectedImporterTitle').innerText = importerName;
      document.getElementById('importerPortalModal').style.display = 'flex';

      const myItems = products.filter(p => p.importer && p.importer.includes(importerName));
      document.getElementById('portalStatCount').innerText = myItems.length;

      document.getElementById('portalStatHot').innerText = "...";
      document.getElementById('portalStatCold').innerText = "...";
      document.getElementById('portalChartContent').innerHTML = '<div style="text-align:center; color:#64748b; font-size:0.8rem; padding:12px;">בודק נתוני אמת מהמערכת...</div>';

      const { hotCount, coldCount, modelStats } = await getLiveLeadsCount(importerName);

      document.getElementById('portalStatHot').innerText = hotCount;
      document.getElementById('portalStatCold').innerText = coldCount;

      const chartEl = document.getElementById('portalChartContent');
      if (hotCount === 0) {
        chartEl.innerHTML = '<div style="text-align:center; color:#64748b; font-size:0.8rem; padding:12px;">טרם נרשמו פניות השבוע לפריטים אלו (0 פניות כרגע)</div>';
      } else {
        chartEl.innerHTML = Object.entries(modelStats).map(([modelName, clicks]) => {
          const percent = Math.min(100, Math.round((clicks / hotCount) * 100));
          return `
            <div class="bar-row" style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.8rem;">
              <div style="width:110px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; font-weight:600;" title="${modelName}">${modelName}</div>
              <div style="flex:1; height:10px; background:#e2e8f0; border-radius:5px; overflow:hidden;">
                <div style="height:100%; width:${percent}%; background:#0284c7;"></div>
              </div>
              <div style="font-size:0.75rem; font-weight:700; width:45px; text-align:left;">${clicks} ✉️</div>
            </div>
          `;
        }).join('');
      }

      const tbody = document.getElementById('portalTableBody');
      tbody.innerHTML = myItems.map(p => `
        <tr>
          <td><b>${p.brand} ${p.model}</b> <span style="color:#64748b; font-size:0.75rem;">(${p.year})</span></td>
          <td>${p.sizes}</td>
          <td><b>${p.outletPrice}</b></td>
          <td><span class="btn-remove-stock" style="color:#ef4444; font-weight:700; cursor:pointer;" onclick="alert('בקשת הסרה נשלחה למערכת')">🗑️ הסר</span></td>
        </tr>
      `).join('');
    }

    // 7. טעינה ראשונית של הדף
    // ==========================================
    initFilters();
    renderCatalog();
    updatePromoSlider();
